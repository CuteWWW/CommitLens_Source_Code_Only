[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commitlens"
version = "0.2.0"
description = "Evidence-backed Git history health diagnosis with eight checks, findings, and recommendations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []            # 只用标准库，这是刻意的设计决定（见 docs/adr/0003）
authors = [{ name = "CS5351 Team" }]
license = { text = "MIT" }

[project.scripts]
commitlens = "commitlens.cli:main"

[tool.setuptools]
packages = ["commitlens", "commitlens.metrics", "commitlens.report"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
